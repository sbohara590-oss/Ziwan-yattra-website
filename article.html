<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173b78">
  <title>Article | ZIWAN YATTRA</title>
  <style>
    :root{--navy:#173b78;--ink:#172033;--muted:#667085;--line:#e5eaf1;--paper:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6fa;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7}
    .page{width:min(100%,820px);min-height:100vh;margin:auto;background:var(--paper)}
    header{padding:17px 18px;border-bottom:1px solid var(--line)}
    .brand{color:var(--navy);font-weight:850;letter-spacing:.04em}
    .back{display:inline-block;margin-top:8px;color:var(--navy);font-size:13px;font-weight:750;text-decoration:none}
    main{padding:20px 18px 40px}
    .meta{color:var(--muted);font-size:12px;margin-bottom:9px}
    .category{display:inline-block;padding:3px 8px;border-radius:6px;background:#edf3ff;color:var(--navy);font-weight:800;margin-right:8px}
    .hero{display:block;width:100%;max-height:440px;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#eef2f7;margin:14px 0 20px}
    .title{font-size:clamp(25px,5vw,38px);line-height:1.2;letter-spacing:-.03em;margin:0 0 12px}
    .summary{font-size:17px;color:#475467;margin:0 0 20px}
    .content{font-size:16px;overflow-wrap:anywhere}
    .content p{margin:0 0 1em}
    .content img{max-width:100%;height:auto}
    .state{padding:30px 12px;text-align:center;color:var(--muted)}
    .article-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:22px;padding-top:12px;color:var(--muted);font-size:13px}
    .action-item{display:inline-flex;align-items:center;gap:5px}
    button.action-button{font:inherit;color:inherit;background:none;border:0;padding:4px 0;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
    button.action-button:hover{color:var(--navy)}
    button.action-button:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:3px}
    button.action-button.liked{color:#d83b56}
    .action-icon{width:16px;height:16px;display:block;flex-shrink:0}
    .action-status{font-size:12px;color:var(--muted);margin-top:5px;min-height:18px}
    footer{padding:17px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">ZIWAN YATTRA</div>
      <a class="back" href="/daily-updates.html">← Back to Daily Updates</a>
    </header>

    <main id="article">
      <div class="state">Loading article...</div>
    </main>

    <footer>© <span id="year"></span> ZIWAN YATTRA</footer>
  </div>

  <script>
    "use strict";

    const API_BASE =
      (location.hostname === "localhost" || location.hostname === "127.0.0.1")
        ? "http://localhost:3000"
        : "https://ziwan-yattra-backend.onrender.com";

    const target = document.getElementById("article");
    document.getElementById("year").textContent = new Date().getFullYear();

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
      }[c]));
    }

    function categoryName(value) {
      const c = String(value || "").trim().toLowerCase();
      if (["gk", "general knowledge", "general_knowledge"].includes(c)) return "General Knowledge";
      if (["gaming", "sports", "sport"].includes(c)) return c === "gaming" ? "Gaming" : "Sports";
      return "News";
    }

    function formatDate(value) {
      if (!value) return "";
      const d = new Date(value);
      return Number.isNaN(d.getTime())
        ? ""
        : d.toLocaleDateString("en-IN", {year:"numeric", month:"short", day:"numeric"});
    }

    function contentHtml(value) {
      return escapeHtml(value || "")
        .replace(/\r\n?/g, "\n")
        .split(/\n{2,}/)
        .map(part => `<p>${part.replace(/\n/g, "<br>")}</p>`)
        .join("");
    }

    // Create a stable token for this browser.
    function getVoterToken() {
      const key = "zy_article_voter_token";
      try {
        let token = localStorage.getItem(key);
        if (!token) {
          token = Array.from(
            crypto.getRandomValues(new Uint8Array(24)),
            b => b.toString(16).padStart(2, "0")
          ).join("");
          localStorage.setItem(key, token);
        }
        return token;
      } catch {
        return "";
      }
    }

    function getStoredLike(postId) {
      try {
        return localStorage.getItem(`zy_liked_${postId}`) === "yes";
      } catch {
        return false;
      }
    }

    function setStoredLike(postId, liked) {
      try {
        localStorage.setItem(`zy_liked_${postId}`, liked ? "yes" : "no");
      } catch {}
    }

    async function apiJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          Accept: "application/json",
          ...(options.body ? {"Content-Type":"application/json"} : {}),
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }
      return data;
    }

    async function setupArticleActions(post) {
      const postId = Number(post.id);
      const viewCount = document.getElementById("view-count");
      const likeCount = document.getElementById("like-count");
      const likeButton = document.getElementById("like-button");
      const shareButton = document.getElementById("share-button");
      const status = document.getElementById("action-status");

      if (!Number.isSafeInteger(postId) || postId <= 0) {
        status.textContent = "Article statistics unavailable.";
        return;
      }

      let liked = getStoredLike(postId);
      let likes = 0;
      let views = 0;
      let likeBusy = false;

      function renderCounts() {
        viewCount.textContent = views.toLocaleString("en-IN");
        likeCount.textContent = likes.toLocaleString("en-IN");
        likeButton.classList.toggle("liked", liked);
        likeButton.setAttribute("aria-pressed", String(liked));
        likeButton.setAttribute("aria-label", liked ? "Unlike this article" : "Like this article");
      }

      // Record one view per article per browser tab session.
      const sessionKey = `zy_viewed_${postId}`;
      let shouldRecordView = true;
      try {
        shouldRecordView = sessionStorage.getItem(sessionKey) !== "yes";
      } catch {}

      try {
        if (shouldRecordView) {
          const result = await apiJson(
            `${API_BASE}/api/daily-posts/${postId}/view`,
            {method:"POST", body:JSON.stringify({})}
          );
          if (Number.isFinite(Number(result.views))) {
            views = Number(result.views);
          }
          try { sessionStorage.setItem(sessionKey, "yes"); } catch {}
        }

        const stats = await apiJson(`${API_BASE}/api/daily-posts/${postId}/stats`);
        if (Number.isFinite(Number(stats.views))) views = Number(stats.views);
        if (Number.isFinite(Number(stats.likes))) likes = Number(stats.likes);
        renderCounts();
      } catch (error) {
        console.error("Article statistics error:", error);
        status.textContent = "Views and likes are temporarily unavailable.";
      }

      likeButton.addEventListener("click", async () => {
        if (likeBusy) return;

        const voterToken = getVoterToken();
        if (!voterToken) {
          status.textContent = "Please enable site storage to like this article.";
          return;
        }

        likeBusy = true;
        likeButton.disabled = true;
        status.textContent = "Updating like…";

        try {
          const result = await apiJson(
            `${API_BASE}/api/daily-posts/${postId}/like`,
            {
              method: "POST",
              body: JSON.stringify({voter_token:voterToken})
            }
          );

          liked = Boolean(result.liked);
          likes = Number(result.likes) || 0;
          setStoredLike(postId, liked);
          renderCounts();
          status.textContent = liked ? "You liked this article." : "Like removed.";
        } catch (error) {
          console.error("Like update error:", error);
          status.textContent = error.message || "Could not update like.";
        } finally {
          likeBusy = false;
          likeButton.disabled = false;
        }
      });

      shareButton.addEventListener("click", async () => {
        const shareData = {
          title: post.title || "ZIWAN YATTRA",
          text: post.description || post.title || "Read this article on ZIWAN YATTRA",
          url: location.href
        };

        try {
          if (navigator.share) {
            await navigator.share(shareData);
          } else if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(location.href);
            status.textContent = "Article link copied.";
          } else {
            status.textContent = "Copy the article link from your browser address bar.";
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            status.textContent = "Unable to share right now.";
          }
        }
      });
    }

    async function loadArticle() {
      const params = new URLSearchParams(location.search);
      const slug = params.get("slug");
      const id = params.get("id");

      if (!slug && !id) {
        target.innerHTML = '<div class="state">This article could not be found.</div>';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/api/daily-posts`, {
          headers: {Accept:"application/json"}
        });
        const result = await response.json();
        const posts = Array.isArray(result.posts) ? result.posts : Array.isArray(result) ? result : [];

        const post = posts.find(item =>
          String(item.status || "published").toLowerCase() === "published" &&
          (slug ? String(item.slug || "") === slug : String(item.id) === id)
        );

        if (!response.ok || !post) {
          target.innerHTML = '<div class="state">This article is unavailable or has not been published.</div>';
          return;
        }

        const image = post.image_url
          ? `<img class="hero" src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title || "Article image")}">`
          : "";

        const date = formatDate(post.published_at || post.created_at);
        const summary = post.description || "";

        target.innerHTML = `
          <div class="meta">
            <span class="category">${escapeHtml(categoryName(post.category))}</span>
            ${escapeHtml(date)}
          </div>
          <h1 class="title">${escapeHtml(post.title || "Untitled article")}</h1>
          ${summary ? `<p class="summary">${escapeHtml(summary)}</p>` : ""}
          ${image}
          <article class="content">${contentHtml(post.content || post.description || "Full article content is not available.")}</article>

          <div class="article-actions" aria-label="Article actions">
            <span class="action-item" aria-label="Article views">
              <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <span id="view-count">—</span> Views
            </span>

            <button class="action-button" id="like-button" type="button" aria-pressed="false">
              <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M7 10v10H4a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h3Zm0 0 5-7a3 3 0 0 1 2 3l-1 4h5a2 2 0 0 1 2 2l-1 6a2 2 0 0 1-2 2H7"/>
              </svg>
              <span>Like</span>
              <span id="like-count">0</span>
            </button>

            <button class="action-button" id="share-button" type="button">
              <svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="18" cy="5" r="3"/>
                <circle cx="6" cy="12" r="3"/>
                <circle cx="18" cy="19" r="3"/>
                <path d="m8.7 10.7 6.6-4.4M8.7 13.3l6.6 4.4"/>
              </svg>
              <span>Share</span>
            </button>
          </div>
          <div class="action-status" id="action-status" role="status" aria-live="polite"></div>
        `;

        document.title = `${post.title || "Article"} | ZIWAN YATTRA`;
        await setupArticleActions(post);
      } catch (error) {
        console.error("Article loading error:", error);
        target.innerHTML = '<div class="state">We could not load this article right now. Please try again in a moment.</div>';
      }
    }

    loadArticle();
  </script>
</body>
</html>
