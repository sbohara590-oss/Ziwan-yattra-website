<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZIWAN YATTRA - Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f8;font-family:Arial,sans-serif;color:#222}
header{background:#35216b;color:#fff;padding:20px}
header h2{margin:0 0 6px}
main{max-width:760px;margin:22px auto;padding:16px}
.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 15px #0001;margin-bottom:18px}
label{display:block;font-weight:bold;margin:15px 0 7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:12px 6px 0 0}
button:disabled{opacity:.5;cursor:wait}
.primary{background:#35216b;color:white}
.secondary{background:#e8e8ef;color:#222}
.note{background:#fff7df;padding:12px;border-radius:8px;font-size:14px;line-height:1.5}
#status{margin-top:15px;line-height:1.5;overflow-wrap:anywhere}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h2>ZIWAN YATTRA</h2>
  <div>Daily Updates — Admin Panel</div>
</header>

<main>
  <section class="card" id="loginCard">
    <h2>Admin Login</h2>
    <div class="note">Login sirf website administrator ke liye hai.</div>
    <form id="loginForm">
      <label for="password">Admin Password</label>
      <input id="password" type="password" required autocomplete="current-password">
      <button class="primary" type="submit">Login</button>
    </form>
    <div id="loginStatus" role="status" aria-live="polite"></div>
  </section>

  <section class="card hidden" id="editorCard">
    <h2>Create New Post</h2>
    <div class="note">Post save karne ke liye backend login zaroori hai. Image ke liye filhaal public image URL use karo.</div>

    <form id="postForm">
      <label for="title">Post Title *</label>
      <input id="title" required maxlength="180" placeholder="Enter post title">

      <label for="category">Category *</label>
      <select id="category" required>
        <option value="News">News</option>
        <option value="Gaming">Gaming</option>
        <option value="Sports">Sports</option>
        <option value="General Knowledge">General Knowledge</option>
      </select>

      <label for="image">Image URL</label>
      <input id="image" type="url" maxlength="2000" placeholder="https://example.com/photo.jpg">

      <label for="description">Short Description *</label>
      <textarea id="description" required maxlength="500" placeholder="Short summary"></textarea>

      <label for="content">Full Content *</label>
      <textarea id="content" required placeholder="Write the complete article"></textarea>

      <label for="links">Internal Links (one per line)</label>
      <textarea id="links" placeholder="/daily-updates.html&#10;/technician.html"></textarea>

      <button class="secondary" type="button" data-status="draft">Save Draft</button>
      <button class="primary" type="button" data-status="published">Publish Post</button>
      <button class="secondary" type="button" id="logoutButton">Logout</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
</main>

<script>
/*
  IMPORTANT:
  Replace this with the EXACT public URL shown for your
  Ziwan-yattra-backend service in Render.
*/
const API_BASE = "https://ziwan-yattra-backend.onrender.com";

const loginCard = document.getElementById("loginCard");
const editorCard = document.getElementById("editorCard");
const loginForm = document.getElementById("loginForm");
const loginStatus = document.getElementById("loginStatus");
const form = document.getElementById("postForm");
const statusBox = document.getElementById("status");

let adminToken = "";

function showStatus(element, message, isError = false) {
  element.textContent = message;
  element.style.color = isError ? "#b00020" : "#176b36";
}

loginForm.addEventListener("submit", async event => {
  event.preventDefault();
  const button = loginForm.querySelector("button");
  button.disabled = true;
  showStatus(loginStatus, "Logging in...");

  try {
    const response = await fetch(`${API_BASE}/api/admin/login`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        password: document.getElementById("password").value
      })
    });

    const result = await response.json();

    if (!response.ok || !result.success || !result.token) {
      throw new Error(result.error || "Login failed. Password or API route check karo.");
    }

    adminToken = result.token;
    loginForm.reset();
    loginCard.classList.add("hidden");
    editorCard.classList.remove("hidden");
    showStatus(statusBox, "Login successful. Ab post create kar sakte ho.");
  } catch (error) {
    showStatus(loginStatus, error.message || "Backend se connection nahi hua.", true);
  } finally {
    button.disabled = false;
  }
});

document.querySelectorAll("button[data-status]").forEach(button => {
  button.addEventListener("click", async () => {
    if (!adminToken) {
      showStatus(statusBox, "Pehle admin login karo.", true);
      return;
    }
    if (!form.reportValidity()) return;

    const payload = {
      title: document.getElementById("title").value.trim(),
      category: document.getElementById("category").value,
      image_url: document.getElementById("image").value.trim(),
      description: document.getElementById("description").value.trim(),
      content: document.getElementById("content").value.trim(),
      internal_links: document.getElementById("links").value
        .split("\n").map(x => x.trim()).filter(Boolean),
      status: button.dataset.status
    };

    if (payload.internal_links.some(link =>
      link.length > 500 ||
      /^(javascript:|data:)/i.test(link)
    )) {
      showStatus(statusBox, "Internal links check karo.", true);
      return;
    }

    button.disabled = true;
    showStatus(statusBox, "Post save ho raha hai...");

    try {
      const response = await fetch(`${API_BASE}/api/admin/posts`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${adminToken}`
        },
        body: JSON.stringify(payload)
      });

      const result = await response.json();

      if (response.status === 401 || response.status === 403) {
        adminToken = "";
        editorCard.classList.add("hidden");
        loginCard.classList.remove("hidden");
        throw new Error("Login expire hua. Dobara login karo.");
      }

      if (!response.ok || !result.success) {
        throw new Error(result.error || "Post save nahi hua.");
      }

      showStatus(statusBox,
        payload.status === "published"
          ? "Post publish ho gaya! Daily Updates page refresh karke check karo."
          : "Draft save ho gaya."
      );

      form.reset();
    } catch (error) {
      showStatus(statusBox, error.message || "Backend error. Render logs check karo.", true);
    } finally {
      button.disabled = false;
    }
  });
});

document.getElementById("logoutButton").addEventListener("click", () => {
  adminToken = "";
  form.reset();
  editorCard.classList.add("hidden");
  loginCard.classList.remove("hidden");
  showStatus(loginStatus, "Logged out.");
});
</script>
</body>
</html>
