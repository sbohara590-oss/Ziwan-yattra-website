const originalCalculate=calculate;
calculate=function(t){
 if(t==='Basic Calculator'){const a=Number($('v0').value),b=Number($('v1').value),op=$('operator').value;if(!$('v0').value||!$('v1').value||!Number.isFinite(a)||!Number.isFinite(b))throw Error('Enter both valid numbers.');if((op==='/'||op==='%')&&b===0)throw Error('Cannot divide by zero.');return String(op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:op==='/'?a/b:op==='%'?a%b:Math.pow(a,b));}
 return originalCalculate(t);
};

const originalProcessImage=processImage;
processImage=async function(t){
 if(t==='Image Color Info'){
  const f=$('f')?.files[0];if(!f)throw Error('Select an image first.');
  const url=URL.createObjectURL(f);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('Could not read image'));img.src=url;});
   const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});c.width=Math.min(img.naturalWidth,256);c.height=Math.min(img.naturalHeight,256);ctx.drawImage(img,0,0,c.width,c.height);const d=ctx.getImageData(0,0,c.width,c.height).data;let rr=0,gg=0,bb=0,n=0;for(let i=0;i<d.length;i+=4){rr+=d[i];gg+=d[i+1];bb+=d[i+2];n++;}const r=Math.round(rr/n),g=Math.round(gg/n),b=Math.round(bb/n),hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase();$('preview').innerHTML=`<div style="height:48px;border-radius:10px;background:${hex}"></div>`;return `Average color: ${hex}\\nRGB: ${r}, ${g}, ${b}\\nImage: ${img.naturalWidth} × ${img.naturalHeight}`;
  }finally{URL.revokeObjectURL(url);}
 }
 return originalProcessImage(t);
};

// Make image adjustments available and avoid silent PDF-library failures.
const originalRun=run;
run=async function(t){
 const b=$('run');if(b){b.disabled=true;b.textContent='Working…';}
 try{
  if(t==='Image to PDF'){if(!window.PDFLib)throw Error('PDF library did not load. Connect to the internet and refresh.');const fs=[...($('f')?.files||[])];if(!fs.length)throw Error('Choose one or more images.');const pdf=await PDFLib.PDFDocument.create();for(const f of fs){let bytes=await f.arrayBuffer(),im;if(/png/i.test(f.type))im=await pdf.embedPng(bytes);else if(/jpe?g/i.test(f.type))im=await pdf.embedJpg(bytes);else{const blob=await new Promise((ok,no)=>{const u=URL.createObjectURL(f),img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no(Error('Image conversion failed.'));},'image/jpeg',.92);};img.onerror=()=>{URL.revokeObjectURL(u);no(Error('Could not read image.'));};img.src=u;});im=await pdf.embedJpg(await blob.arrayBuffer());}const pg=pdf.addPage([im.width,im.height]);pg.drawImage(im,{x:0,y:0,width:im.width,height:im.height});}const bytes=await pdf.save();savePDF(bytes,'ziwan-images.pdf');setResult(`Created PDF with ${fs.length} image(s).`);return;}
  if(t==='Image Brightness'||t==='Image Contrast'){const f=$('f')?.files[0];if(!f)throw Error('Select an image first.');const url=URL.createObjectURL(f);try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('Could not read image'));img.src=url;});const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=img.naturalWidth;c.height=img.naturalHeight;ctx.drawImage(img,0,0);const d=ctx.getImageData(0,0,c.width,c.height),v=Number($('adjust').value);for(let i=0;i<d.data.length;i+=4)for(let j=0;j<3;j++)d.data[i+j]=t==='Image Brightness'?Math.max(0,Math.min(255,d.data[i+j]+v*2.55)):Math.max(0,Math.min(255,(d.data[i+j]-128)*(1+v/100)+128));ctx.putImageData(d,0,0);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.92));if(!blob)throw Error('Could not create adjusted image.');const a=$('download');a.href=URL.createObjectURL(blob);a.download='ziwan-'+t.toLowerCase().replace(/\\s+/g,'-')+'.jpg';a.classList.remove('hidden');setResult('Image adjustment complete. Use Download result.');}finally{URL.revokeObjectURL(url);}return;}
  if(t==='Month Calendar'){const y=Number($('year').value),m=Number($('month').value);if(!Number.isInteger(y)||y<1||y>9999||!Number.isInteger(m)||m<1||m>12)throw Error('Enter a valid year and month.');const first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let rows=names.join('   ')+'\\n';for(let i=0;i<first;i++)rows+='     ';for(let d=1;d<=days;d++){rows+=String(d).padStart(3,' ')+'  ';if((first+d)%7===0)rows+='\\n';}setResult(new Date(y,m-1,1).toLocaleDateString(undefined,{month:'long',year:'numeric'})+'\\n\\n'+rows);return;}
  if(t.includes('PDF')&&!window.PDFLib)throw Error('PDF tools need the PDF library. Connect to the internet, refresh the page, then try again.');
  await originalRun(t);
 }catch(e){setResult('Could not complete: '+e.message)}finally{if(b){b.disabled=false;b.textContent='Run tool';}}
};

// Persist theme and add live search across all category cards.
try{if(localStorage.getItem('zy-tools-theme')==='dark')document.body.classList.add('dark');}catch(e){}
$('theme').textContent=document.body.classList.contains('dark')?'☀':'☾';
$('theme').onclick=()=>{document.body.classList.toggle('dark');const dark=document.body.classList.contains('dark');$('theme').textContent=dark?'☀':'☾';try{localStorage.setItem('zy-tools-theme',dark?'dark':'light')}catch(e){}};
$('toolSearch').addEventListener('input',()=>{const q=$('toolSearch').value.trim().toLowerCase();document.querySelectorAll('.card').forEach(card=>{card.style.display=card.textContent.toLowerCase().includes(q)?'':'none'});document.querySelectorAll('.category-section').forEach(sec=>{sec.style.display=[...sec.querySelectorAll('.card')].some(c=>c.style.display!=='none')?'':'none';});});

renderCats();
</script>
