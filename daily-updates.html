<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173b78"><meta name="description" content="ZIWAN YATTRA Daily Updates — news, gaming, sports and general knowledge."><title>ZIWAN YATTRA | Daily Updates</title>
<style>
:root{--navy:#173b78;--blue:#2459a9;--ink:#172033;--muted:#667085;--line:#e5eaf1;--paper:#fff;--radius:14px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f4f6fa;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}button,input{font:inherit}.shell{max-width:760px;margin:0 auto;min-height:100vh;background:var(--paper);box-shadow:0 0 28px #182b4d0b}.top{padding:13px 14px 10px;text-align:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);z-index:5}.brand{font-weight:850;letter-spacing:.045em;color:var(--navy);font-size:17px;line-height:1.2}.subbrand{font-size:11px;color:var(--muted);margin-top:3px}.navrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}.cat{border:1px solid var(--line);background:#fff;color:#344054;border-radius:10px;padding:8px 3px;font-size:12px;font-weight:700;cursor:pointer;min-width:0}.cat.active{background:var(--navy);border-color:var(--navy);color:#fff}.home-link{position:absolute;left:12px;top:16px;text-decoration:none;color:var(--navy);font-size:12px;font-weight:750;white-space:nowrap}.search-wrap{padding:12px 14px 0}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;outline:none}.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2459a91c}.feed{padding:12px 14px 28px}.feed-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}.feed-title h1{font-size:17px;margin:0;letter-spacing:-.02em}.count{font-size:11px;color:var(--muted)}.post{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;background:#fff}.post-image{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef2f7}.post-body{padding:12px 13px 11px}.meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px;margin-bottom:5px}.pill{color:var(--navy);background:#edf3ff;border-radius:5px;padding:2px 6px;font-weight:800;font-size:10px;text-transform:uppercase;letter-spacing:.03em}.post h2{font-size:18px;line-height:1.3;margin:0 0 6px;letter-spacing:-.02em}.excerpt{font-size:13px;color:#475467;margin:0 0 10px;white-space:pre-line}.post-actions{display:flex;align-items:center;gap:14px;border-top:1px solid #f0f2f6;padding-top:9px}.read{margin-left:auto;text-decoration:none;color:var(--navy);font-size:12px;font-weight:800}.empty,.notice{border:1px dashed #ccd5e3;border-radius:12px;padding:28px 15px;text-align:center;color:var(--muted);font-size:13px}.notice{margin:12px 14px 0;padding:12px;border-style:solid}.footer{padding:16px 14px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:11px}.footer a{color:var(--navy);text-decoration:none;font-weight:700}@media(min-width:620px){.top{padding:15px 20px 12px}.navrow{max-width:520px;margin:12px auto 0}.home-link{left:20px;top:18px}.search-wrap,.feed{padding-left:20px;padding-right:20px}.post-body{padding:15px 16px 13px}.post h2{font-size:20px}}@media(max-width:380px){.home-link{position:static;display:block;text-align:left;margin-bottom:6px}.cat{font-size:11px}.post h2{font-size:17px}}
</style></head>
<body><main class="shell"><header class="top"><a class="home-link" href="/index.html" aria-label="Digital Help Home">← Help Home</a><div class="brand">ZIWAN YATTRA</div><div class="subbrand">Daily Updates</div><nav class="navrow" aria-label="Post categories"><button class="cat active" type="button" data-category="News">News</button><button class="cat" type="button" data-category="Gaming">Gaming</button><button class="cat" type="button" data-category="Sports">Sports</button><button class="cat" type="button" data-category="General Knowledge">GK</button></nav></header><div class="search-wrap"><input class="search" id="searchInput" type="search" placeholder="Search posts..." aria-label="Search posts"></div><div id="pageNotice" class="notice" hidden></div><section class="feed" aria-live="polite"><div class="feed-title"><h1 id="feedHeading">Latest News</h1><span class="count" id="postCount">Loading...</span></div><div id="postList"><div class="empty">Loading updates…</div></div></section><footer class="footer"><a href="/index.html">← Digital Help Center</a><span> · </span><a href="/privacy-policy.html">Privacy Policy</a><div style="margin-top:5px">© <span id="year"></span> ZIWAN YATTRA</div></footer></main>
<script>
"use strict";
let allPosts=[];let activeCategory="News";
const postList=document.getElementById("postList"),searchInput=document.getElementById("searchInput"),postCount=document.getElementById("postCount"),pageNotice=document.getElementById("pageNotice");
document.getElementById("year").textContent=new Date().getFullYear();
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function normaliseCategory(v){const c=String(v||"").trim().toLowerCase();if(["gk","general knowledge","general_knowledge"].includes(c))return "General Knowledge";if(c==="gaming")return "Gaming";if(["sports","sport"].includes(c))return "Sports";return "News"}
function formatDate(v){if(!v)return "Recent";const d=new Date(v);return Number.isNaN(d.getTime())?"Recent":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})}
function articleHref(p){const c=p.article_url||p.url||p.link||"";if(typeof c==="string"&&c.trim()){const v=c.trim();if(v.startsWith("/")&&!v.startsWith("//"))return v;try{const u=new URL(v,location.origin);if(u.protocol==="https:")return u.href}catch(_){}}if(p.slug&&/^[a-z0-9]+(?:-[a-z0-9]+)*$/i.test(String(p.slug)))return "/article.html?slug="+encodeURIComponent(p.slug);return ""}
function card(p){const title=p.title||"Untitled update",description=p.description||p.excerpt||p.content||"",category=normaliseCategory(p.category),date=formatDate(p.published_at||p.created_at);let image="";if(typeof p.image_url==="string"&&p.image_url.trim()){try{const u=new URL(p.image_url.trim(),location.origin);if(["https:","http:"].includes(u.protocol))image=`<img class="post-image" src="${esc(u.href)}" alt="${esc(title)}" loading="lazy">`}catch(_){}}if(!image)image='<div class="post-image" style="display:grid;place-items:center;color:#8793a7;font-size:12px">Photo coming soon</div>';const href=articleHref(p),read=href?`<a class="read" href="${esc(href)}">Read article →</a>`:'<span class="read">Article page coming soon</span>';return `<article class="post">${image}<div class="post-body"><div class="meta"><span class="pill">${esc(category)}</span><span>${esc(date)}</span></div><h2>${esc(title)}</h2><p class="excerpt">${esc(description)}</p><div class="post-actions">${read}</div></div></article>`}
function render(){const q=searchInput.value.trim().toLowerCase();const posts=allPosts.filter(p=>String(p.status||"published").toLowerCase()==="published"&&normaliseCategory(p.category)===activeCategory&&[p.title,p.description,p.excerpt,p.content,p.category].map(v=>String(v||"")).join(" ").toLowerCase().includes(q));const labels={News:"Latest News",Gaming:"Gaming Updates",Sports:"Sports Updates","General Knowledge":"General Knowledge"};document.getElementById("feedHeading").textContent=labels[activeCategory]||"Latest Updates";postCount.textContent=`${posts.length} post${posts.length===1?"":"s"}`;postList.innerHTML=posts.length?posts.map(card).join(""):`<div class="empty">${allPosts.length?"No posts in this category yet. Try another category.":"No published posts yet. Your first published post will appear here."}</div>`}
async function fetchPosts(){postList.innerHTML='<div class="empty">Loading updates…</div>';pageNotice.hidden=true;try{const apiBase=(location.protocol==="file:"||["localhost","127.0.0.1"].includes(location.hostname))?"http://localhost:3000":"";const response=await fetch(`${apiBase}/api/daily-posts`,{headers:{Accept:"application/json"}});let result;try{result=await response.json()}catch(_){throw new Error("Server returned an unreadable response.")}if(!response.ok||result.success===false)throw new Error(result.error||`Request failed (${response.status}).`);const rows=Array.isArray(result)?result:Array.isArray(result.posts)?result.posts:Array.isArray(result.data)?result.data:Array.isArray(result.data?.posts)?result.data.posts:null;if(!rows)throw new Error("API response received, but no posts array was found. Check /api/daily-posts response.");allPosts=rows;render()}catch(e){console.error("Daily Updates loading error:",e);postCount.textContent="Unavailable";postList.innerHTML='<div class="empty">Updates load nahi ho paaye. Backend chalu hai ya nahi check karke page refresh karo.</div>';pageNotice.textContent=e.message||"Could not load posts.";pageNotice.hidden=false}}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{activeCategory=b.dataset.category;document.querySelectorAll(".cat").forEach(x=>x.classList.toggle("active",x===b));render();window.scrollTo({top:0,behavior:"smooth"})}));searchInput.addEventListener("input",render);fetchPosts();
</script></body></html>
