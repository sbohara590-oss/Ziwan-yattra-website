<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fc"><title>ZIWAN YATTRA AI</title>
<style>
:root{--bg:#f7f8fc;--card:#fff;--ink:#202536;--muted:#7b8293;--line:#e8eaf1;--purple:#6048d8}
*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,textarea{font:inherit}
.app{height:100%;display:flex}.sidebar{width:278px;background:#fff;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin:2px 0 20px}.brand img{width:38px;height:38px;border-radius:11px;object-fit:cover}
.sidebtn{width:100%;padding:12px;border:1px solid var(--line);background:white;border-radius:13px;text-align:left;font-weight:650;color:var(--ink);margin-bottom:8px}
.sidebtn:hover,.history button:hover{background:#f7f5ff}.label{font-size:11px;color:#999eac;letter-spacing:1px;margin:20px 8px 8px}
.history{display:flex;flex-direction:column;gap:3px;overflow:auto}.history button{border:0;background:transparent;padding:10px;border-radius:9px;text-align:left;color:#62697a;font-size:13px}
.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding-top:13px}.profile{display:flex;align-items:center;gap:10px;padding:8px 2px 0;font-size:13px;font-weight:650}
.avatar{width:35px;height:35px;border-radius:50%;background:#eeeaff;color:#6048d8;display:grid;place-items:center}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.top{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-weight:750}
.menuBtn{display:none}.top small{font-size:12px;color:#9298a8;font-weight:500}
.chat{flex:1;overflow:auto;padding:24px 16px 155px}.welcome{max-width:650px;text-align:center;margin:7vh auto 0}
.logo{width:104px;height:104px;margin:0 auto 20px;padding:4px;border-radius:50%;background:conic-gradient(#e5bb54,#7055e8,#22b8cf,#e5bb54);box-shadow:0 0 0 7px #6048d812,0 12px 32px #6048d826}
.logo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid white}
h1{font-size:30px;margin:0 0 6px}.sub{font-size:14px;color:var(--muted);margin:0}
.prompts{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:510px;margin:28px auto}.prompt{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;text-align:left;font-weight:650;color:#454b5b}
.messages{max-width:740px;margin:auto;display:flex;flex-direction:column;gap:14px}.msg{max-width:88%;padding:13px 16px;border-radius:17px;line-height:1.55;font-size:14px;white-space:pre-wrap}.user{align-self:flex-end;background:#eae6ff}.info{align-self:flex-start;background:white;border:1px solid var(--line)}
.composerWrap{position:absolute;bottom:0;left:0;right:0;padding:15px 16px 20px;background:linear-gradient(transparent,var(--bg) 20%)}
.composer{max-width:740px;margin:auto;background:white;border:1px solid #e0e2eb;border-radius:24px;padding:9px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 8px 30px #191e3710}
.circle{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:50%;background:#f0eff7;color:#53596a;font-size:20px;display:grid;place-items:center}
.send{background:var(--purple);color:white}.voice{background:#f0edff;color:var(--purple)}textarea{flex:1;min-width:0;max-height:110px;resize:none;border:0;outline:0;padding:10px 3px;background:transparent;color:var(--ink)}textarea::placeholder{color:#9a9faf}
.hint{text-align:center;color:#a0a5b1;font-size:10px;margin:7px auto 0}
.plusBox{position:relative}.attach{display:none;position:absolute;bottom:48px;left:0;width:210px;padding:7px;background:white;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #191e3718}.attach.open{display:block}.attach button{display:block;width:100%;border:0;background:white;text-align:left;padding:10px;border-radius:8px;color:#454b5b}.attach button:hover{background:#f4f2ff}
.overlay{display:none}.modalShade{display:none;position:fixed;inset:0;background:#11182766;z-index:10;align-items:center;justify-content:center;padding:16px}.modalShade.show{display:flex}.settings{background:white;color:#202536;width:min(560px,100%);max-height:85dvh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 20px 60px #0003}.settingsHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.settingRow{padding:13px 2px;border-bottom:1px solid #edf0f5}.settingRow b{display:block;font-size:14px}.settingRow span{font-size:12px;color:#858b9a}
.voiceScreen{display:none;position:fixed;inset:0;z-index:20;color:#fff;background:radial-gradient(ellipse at 50% 38%,#273d69 0%,#151d35 38%,#0b1020 100%);align-items:center;justify-content:center;flex-direction:column;padding:25px;text-align:center}
.voiceScreen.show{display:flex}.voiceTop{position:absolute;top:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center}.voiceTop span{font-size:14px;font-weight:650;letter-spacing:.3px}.closeVoice{width:42px;height:42px;border:1px solid #ffffff2c;border-radius:50%;background:#ffffff12;color:white;font-size:23px}
.voiceOrb{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;position:relative;margin:0 auto 32px;background:radial-gradient(circle at 35% 30%,#79d9ed 0%,#547be1 28%,#6c4bc9 58%,#17264c 78%);box-shadow:0 0 35px #5b8cff66,0 0 90px #7b5be844;animation:orbFloat 4s ease-in-out infinite}
.voiceOrb:before,.voiceOrb:after{content:"";position:absolute;inset:-13px;border-radius:50%;border:1px solid #a8c8ff55;animation:ring 2.8s ease-out infinite}.voiceOrb:after{animation-delay:1.4s}
.voiceOrb img{width:82px;height:82px;object-fit:cover;border-radius:50%;border:3px solid #ffffffcc;box-shadow:0 4px 25px #08142b66}
.voiceTitle{font-size:26px;font-weight:700;margin-bottom:8px}.voiceStatus{color:#c5d2e9;font-size:14px}.voiceBars{height:36px;display:flex;gap:5px;align-items:center;margin:22px auto 35px}.voiceBars i{display:block;width:4px;border-radius:5px;background:#a9dff3;height:9px;animation:bar 1s ease-in-out infinite alternate}.voiceBars i:nth-child(2n){animation-delay:.2s}.voiceBars i:nth-child(3n){animation-delay:.45s}
.voiceControls{display:flex;align-items:center;gap:22px}.voiceControl{width:58px;height:58px;border:1px solid #ffffff35;border-radius:50%;background:#ffffff16;color:white;font-size:21px}.endVoice{background:#e64d61;border:0;width:66px;height:66px}.voiceFoot{position:absolute;bottom:22px;color:#8e9bb5;font-size:11px}
@keyframes ring{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes orbFloat{50%{transform:translateY(-7px) scale(1.025)}}@keyframes bar{to{height:27px;opacity:.65}}
@media(max-width:700px){.sidebar{position:fixed;inset:0 auto 0 0;width:min(82vw,290px);transform:translateX(-105%);transition:.2s;box-shadow:0 8px 30px #1113}.sidebar.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#1116;z-index:4}.menuBtn{display:inline-block;border:0;background:none;font-size:20px;margin-right:8px}.top{padding:0 12px}.chat{padding:20px 12px 145px}.welcome{margin-top:8vh}.logo{width:92px;height:92px}.prompts{gap:8px;margin-top:23px}.prompt{font-size:12px;padding:12px}.composerWrap{padding:10px 9px calc(10px + env(safe-area-inset-bottom))}.voiceOrb{width:165px;height:165px}.voiceTitle{font-size:23px}}
@media(max-width:370px){.prompts{grid-template-columns:1fr}}
</style></head><body>
